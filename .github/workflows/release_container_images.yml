name: Publish container images

"on":
  workflow_call:

permissions:
  contents: read

jobs:
  dockerhub:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set image version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build and publish prerelease default image
        if: contains(github.ref_name, '-')
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          platforms: linux/amd64,linux/arm64,linux/ppc64le,linux/s390x,linux/386,linux/arm/v7,linux/arm/v6
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/bats:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/bats:${{ steps.version.outputs.version }}
          push: true
      - name: Build and publish stable default image
        if: ${{ !contains(github.ref_name, '-') }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          platforms: linux/amd64,linux/arm64,linux/ppc64le,linux/s390x,linux/386,linux/arm/v7,linux/arm/v6
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/bats:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKER_USERNAME }}/bats:latest
            ghcr.io/${{ github.repository_owner }}/bats:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/bats:latest
          push: true
      - name: Build and publish prerelease no-faccessat2 image
        if: contains(github.ref_name, '-')
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          platforms: linux/amd64,linux/arm64,linux/ppc64le,linux/s390x,linux/386,linux/arm/v7,linux/arm/v6
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/bats:${{ steps.version.outputs.version }}-no-faccessat2
            ghcr.io/${{ github.repository_owner }}/bats:${{ steps.version.outputs.version }}-no-faccessat2
          push: true
          build-args: bashver=5.1.4
      - name: Build and publish stable no-faccessat2 image
        if: ${{ !contains(github.ref_name, '-') }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          platforms: linux/amd64,linux/arm64,linux/ppc64le,linux/s390x,linux/386,linux/arm/v7,linux/arm/v6
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/bats:${{ steps.version.outputs.version }}-no-faccessat2
            ${{ secrets.DOCKER_USERNAME }}/bats:latest-no-faccessat2
            ghcr.io/${{ github.repository_owner }}/bats:${{ steps.version.outputs.version }}-no-faccessat2
            ghcr.io/${{ github.repository_owner }}/bats:latest-no-faccessat2
          push: true
          build-args: bashver=5.1.4
