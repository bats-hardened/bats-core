name: MegaLinter

on:
  workflow_dispatch:
    inputs:
      fix_mode:
        description: How to publish autofixes for this run
        required: false
        default: pull_request
        type: choice
        options:
          - none
          - pull_request
      runner:
        description: Runner used for this run
        required: false
        default: ubuntu-latest
        type: choice
        options:
          - ubuntu-latest
          - self-hosted

permissions: {}

jobs:
  megalinter:
    name: Run MegaLinter
    uses: bats-hardened/.github/.github/workflows/megalinter.yml@bb0630e4f173ba1baeb9b579aff9e95f5178ff58 # v1.1.1-beta02
    permissions:
      contents: write
      issues: write
      pull-requests: write
