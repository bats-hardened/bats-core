name: Benchmark npm Windows launcher

on:
  workflow_dispatch:
    inputs:
      os:
        description: Windows runner image
        required: true
        default: windows-2025
        type: choice
        options:
          - windows-2022
          - windows-2025

permissions:
  contents: read

jobs:
  installed-package-without-npm-shim:
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm pack ./
      - run: npm install -g (get-item .\bats-*.tgz).FullName
      - name: Show installed command paths
        shell: pwsh
        run: |
          Get-Command bats -All | Format-List CommandType, Name, Source, Definition
          $npm_prefix = npm prefix -g
          $installed_bats = Join-Path $npm_prefix 'node_modules\@bats-hardened\bats\bin\bats'
          Write-Output "Installed Bash entry point: $installed_bats"
          if (-not (Test-Path $installed_bats)) {
            throw "Installed Bash entry point does not exist"
          }
      - name: Compare PowerShell shim and Bash entry-point environments
        shell: pwsh
        run: |
          $diagnostic_dir = Join-Path $env:RUNNER_TEMP 'bats-launcher-diagnostic'
          New-Item -ItemType Directory -Force $diagnostic_dir | Out-Null
          $helper = Join-Path $diagnostic_dir 'helper.bash'
          $inner_test = Join-Path $diagnostic_dir 'inner.bats'
          $outer_test = Join-Path $diagnostic_dir 'outer.bats'

          @'
          report_environment() {
            local context="$1"
            printf '%s BATS_ROOT=%s\n' "$context" "$BATS_ROOT"
            printf '%s BATS_LIBEXEC=%s\n' "$context" "$BATS_LIBEXEC"
            printf '%s BATS_SAVED_PATH=%s\n' "$context" "$BATS_SAVED_PATH"
            printf '%s PATH=%s\n' "$context" "$PATH"
            printf '%s bats command:\n' "$context"
            type -a bats || true
          }
          '@ | Set-Content -NoNewline $helper

          @'
          load 'helper'

          @test "report nested Bats environment" {
            report_environment nested
          }
          '@ | Set-Content -NoNewline $inner_test

          @'
          load 'helper'

          @test "report outer Bats environment" {
            report_environment outer
            run bats --show-output-of-passing-tests "$DIAGNOSTIC_INNER"
            printf 'nested run status=%s\n' "$status"
            printf '%s\n' "$output"
          }
          '@ | Set-Content -NoNewline $outer_test

          $inner_test_for_bash = (& bash -c 'cygpath -u "$1"' -- $inner_test).Trim()
          $outer_test_for_bash = (& bash -c 'cygpath -u "$1"' -- $outer_test).Trim()
          $env:DIAGNOSTIC_INNER = $inner_test_for_bash
          Write-Output '--- PowerShell npm shim ---'
          & bats --show-output-of-passing-tests $outer_test_for_bash
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $npm_prefix = npm prefix -g
          $installed_bats = Join-Path $npm_prefix 'node_modules\@bats-hardened\bats\bin\bats'
          Write-Output '--- Installed Bash entry point ---'
          & bash -c 'installed_bats=$(cygpath -u "$1"); exec "$installed_bats" --show-output-of-passing-tests "$2"' -- $installed_bats $outer_test_for_bash
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
      - name: Run installed package without the npm PowerShell shim
        shell: pwsh
        run: |
          $npm_prefix = npm prefix -g
          $installed_bats = Join-Path $npm_prefix 'node_modules\@bats-hardened\bats\bin\bats'
          & bash -c 'installed_bats=$(cygpath -u "$1"); time "$installed_bats" -T --print-output-on-failure test' -- $installed_bats
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
